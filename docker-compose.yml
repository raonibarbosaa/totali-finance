services:
  postgres:
    image: postgres:15-alpine
    container_name: totali_postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U totali"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: totali_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://totali:${POSTGRES_PASSWORD:-totali_senha_segura_2026}@postgres:5432/totalifinance
      JWT_SECRET: ${JWT_SECRET:-troque_esta_chave_em_producao}
      JWT_EXPIRES_IN: 24h
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-troque_esta_chave_tambem}
      REFRESH_TOKEN_EXPIRES_IN: 30d
      RESET_TOKEN_EXPIRES_MIN: ${RESET_TOKEN_EXPIRES_MIN:-60}
      PORT: 3000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-https://app.totalicontabilidade.com.br}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-TotaliFinance <noreply@totalicontabilidade.com.br>}
      EMAIL_ADMIN: ${EMAIL_ADMIN:-financeiro@totalicontabilidade.com.br}
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.totali-backend.rule=Host(`finance.totalicontabilidade.com.br`) && PathPrefix(`/api`)"
      - "traefik.http.routers.totali-backend.entrypoints=websecure"
      - "traefik.http.routers.totali-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.totali-backend.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-public"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: totali_frontend
    restart: unless-stopped
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.totali-frontend.rule=Host(`finance.totalicontabilidade.com.br`)"
      - "traefik.http.routers.totali-frontend.entrypoints=websecure"
      - "traefik.http.routers.totali-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.totali-frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-public"

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  traefik-public:
    external: true
