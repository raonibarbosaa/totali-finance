events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript text/xml application/xml;

  # Limite de upload (para arquivos OFX)
  client_max_body_size 10M;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

  # ── HTTP → HTTPS redirect ─────────────────────────────
  server {
    listen 80;
    server_name app.totalicontabilidade.com.br;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS ─────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name app.totalicontabilidade.com.br;

    ssl_certificate     /etc/letsencrypt/live/app.totalicontabilidade.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.totalicontabilidade.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Segurança
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ── API backend ──────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass         http://backend:3000/api/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # ── Health check ─────────────────────────────────────
    location /health {
      proxy_pass http://backend:3000/health;
    }

    # ── Frontend React ───────────────────────────────────
    location / {
      proxy_pass         http://frontend:80;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }
  }
}
